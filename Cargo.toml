[package]
description = "Translates OpenAI Responses API requests to Chat Completions API for third-party LLMs"
edition = "2021"
homepage = "https://github.com/SSebo/codex-responses-adapter"
license = "MIT"
name = "codex-responses-adapter"
readme = "README.md"
repository = "https://github.com/SSebo/codex-responses-adapter"
version = "0.1.0"

[[bin]]
name = "codex-responses-adapter"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = [
    "tokio",
    "server-auto",
    "server-graceful",
] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[workspace]
